use_s2_recommendations: true
s2_limit: 20          # 没 key 时建议 10~30，先保守
s2_retries: 2         # 失败重试次数
s2_backoff_sec: 5     # 重试退避秒数（指数退避的基数）



topic_cn: 功率半导体结温在线监测
timezone: Asia/Shanghai
send_hour_local: 6


search_query: "junction temperature estimation online monitoring IGBT SiC power module"
latest_days: 30

top_latest: 5
top_classic: 2
top_reco: 5
max_related_per_seed: 25


top_reco_s2: 10
top_reco_oa: 10
seen_days_keep: 30
prefer_recent_days: 180




# --- 质量改造：出版商优先池 ---
preferred_publishers:
  - IEEE
  - Elsevier
  - Springer Nature
  - Wiley

# 你想在邮件里单独展示“出版商精选”吗
enable_publisher_pools: true

# 出版商池子里每天取多少条（建议：最新 6~10，经典 6~10）
top_pub_latest: 8
top_pub_classic: 8

# 出版商加分（越大越偏向四大）
publisher_boost: 6

# DOAJ 轻微降权（不做硬过滤，避免误伤）
doaj_penalty: 2

# OpenAlex 每个查询拉多少条（建议 100~200）
openalex_per_page: 200


# 引用图谱扩展（经典优先）
graph_max_references_per_seed: 60
graph_max_citedby_per_seed: 60
graph_classic_years_ago: 5
graph_min_cited_by: 30
top_graph_classic: 10


keywords:
  - "junction temperature"
  - "Tj"
  - "online"
  - "real-time"
  - "monitoring"
  - "estimation"
  - "TSEP"
  - "temperature sensitive electrical parameter"
  - "Vce(sat)"
  - "Vf"
  - "Rds(on)"
  - "electro-thermal"
  - "thermal impedance"
  - "IGBT"
  - "SiC"
  - "MOSFET"
  - "power module"

exclude_keywords:
  - "photovoltaic"

