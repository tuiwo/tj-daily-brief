
name: Random Research

on:
  schedule:
    - cron: '7,22 22 * * *'   # UTC 00:07/00:22/00:37/00:52 => 北京时间 08 点多次尝试
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Restore/Save seen.json cache
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            seen-${{ github.repository }}-
      
      - name: Debug seen before run
        run: ls -l seen.json || echo "no seen.json restored"
            
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Debug schedule string
        run: echo "github.event.schedule=${{ github.event.schedule }}"

      - name: Mask secrets
        run: |
          echo "::add-mask::${OPENALEX_API_KEY}"
          echo "::add-mask::${OPENROUTER_API_KEY}"
          echo "::add-mask::${SMTP_PASS}"
          echo "::add-mask::${S2_API_KEY}"
          echo "::add-mask::${UNPAYWALL_EMAIL}"
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        
      - name: Debug seeds files
        run: |
          pwd
          ls -la
          ls -a src
          find . -maxdepth 4 -name "seeds_positive.txt" -o -name "seeds_negative.txt"
          echo "---- show first 50 lines ----"
          for f in $(find . -maxdepth 6 -name "seeds_positive.txt"); do
            echo "==== $f ===="
            sed -n '1,50p' "$f"
          done
          
      - name: Run
        run: python src/main.py
        env:
          DEBUG: "1"
          STRICT_MODE: "true"
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}

      - name: Debug seen after run
        run: ls -l seen.json || echo "no seen.json after run"
